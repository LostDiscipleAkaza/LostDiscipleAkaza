<svg width="100%" height="200" viewBox="0 0 854 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16161e" />
      <stop offset="100%" stop-color="#1a1b26" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="100%" stop-color="#7dcfff" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bb9af7" />
      <stop offset="100%" stop-color="#b4f9f8" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="852" height="198" rx="12" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Left Column: Activity Overview -->
  <g transform="translate(40, 30)">
    <!-- Header -->
    <text x="0" y="20" fill="url(#cyanGrad)" font-size="20" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Activity Overview</text>
    
    <!-- Item 1: Contributions -->
    <g transform="translate(0, 50)">
      <circle cx="8" cy="8" r="4" fill="#73daca" />
      <text x="24" y="13" fill="#a9b1d6" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Total Contributions:</text>
      <text x="210" y="13" fill="#73daca" font-size="15" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">147</text>
    </g>

    <!-- Item 2: Public Repos -->
    <g transform="translate(0, 80)">
      <circle cx="8" cy="8" r="4" fill="#7aa2f7" />
      <text x="24" y="13" fill="#a9b1d6" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Public Repositories:</text>
      <text x="210" y="13" fill="#7aa2f7" font-size="15" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">37</text>
    </g>

    <!-- Item 3: Followers -->
    <g transform="translate(0, 110)">
      <circle cx="8" cy="8" r="4" fill="#bb9af7" />
      <text x="24" y="13" fill="#a9b1d6" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Followers / Community:</text>
      <text x="210" y="13" fill="#bb9af7" font-size="15" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">14</text>
    </g>
  </g>

  <!-- Divider line -->
  <line x1="427" y1="30" x2="427" y2="170" stroke="#24283b" stroke-width="1.5" />

  <!-- Right Column: Focus & Stack -->
  <g transform="translate(467, 30)">
    <!-- Header -->
    <text x="0" y="20" fill="url(#purpleGrad)" font-size="20" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Core Technical Focus</text>

    <!-- Languages -->
    <g transform="translate(0, 50)">
      <text x="0" y="13" fill="#7aa2f7" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">LANGUAGES</text>
      <rect x="95" y="-3" width="60" height="22" rx="4" fill="#24283b" />
      <text x="125" y="12" fill="#c0caf5" font-size="12" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">C</text>

      <rect x="162" y="-3" width="70" height="22" rx="4" fill="#24283b" />
      <text x="197" y="12" fill="#c0caf5" font-size="12" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Python</text>

      <rect x="239" y="-3" width="85" height="22" rx="4" fill="#24283b" />
      <text x="281" y="12" fill="#c0caf5" font-size="12" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Java (OOP)</text>

      <rect x="331" y="-3" width="50" height="22" rx="4" fill="#24283b" />
      <text x="356" y="12" fill="#c0caf5" font-size="12" font-weight="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Bash</text>
    </g>

    <!-- Security & Tools -->
    <g transform="translate(0, 85)">
      <text x="0" y="13" fill="#bb9af7" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">DOMAINS</text>
      <text x="95" y="13" fill="#a9b1d6" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Cybersecurity • Systems Programming</text>
    </g>

    <!-- Literary Craft -->
    <g transform="translate(0, 115)">
      <text x="0" y="13" fill="#7dcfff" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">WRITING</text>
      <text x="95" y="13" fill="#a9b1d6" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">lostdiscipleakaza.github.io</text>
    </g>
  </g>
</svg>

